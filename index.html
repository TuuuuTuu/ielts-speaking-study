function persist(){try{localStorage.setItem(KEY,JSON.stringify({selected:state.selected,reviewing:[...reviewing]}));$('storageNote').textContent='学习位置与待复习标记保存在此浏览器';}catch{$('storageNote').textContent='当前浏览器仅保留本次学习记录';}}
function topicContextMatches(t){if(!state.query)return true;return normalize([t.title,t.cue,...t.points].join(' ')).includes(normalize(state.query));}
function visibleQuestions(t,g){const context=topicContextMatches(t);const query=normalize(state.query);return g.questions.filter(q=>(state.source==='all'||q.source===state.source)&&(!query||context||normalize(q.text).includes(query)||normalize(g.title).includes(query)));}
function matchingCount(t){return t.sections.reduce((n,g)=>n+visibleQuestions(t,g).length,0);}
function filteredTopics(){return topics.filter(t=>(state.part==='all'||t.part===state.part)&&(state.category==='all'||t.category===state.category)&&(!state.reviewOnly||reviewing.has(t.id))&&matchingCount(t)>0);}
function highlight(s){const text=String(s);const query=normalize(state.query);if(!query)return escapeHTML(text);const at=text.toLocaleLowerCase().indexOf(query);if(at<0)return escapeHTML(text);return escapeHTML(text.slice(0,at))+'<mark>'+escapeHTML(text.slice(at,at+query.length))+'</mark>'+escapeHTML(text.slice(at+query.length));}
function flash(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true;},1800);}
function renderControls(){
 document.querySelectorAll('[data-part]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.part===state.part)));
 document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===state.category)));
 document.querySelectorAll('[data-source]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.source===state.source)));
 $('categoryFilters').hidden=state.part!=='part23';$('reviewFilter').setAttribute('aria-pressed',String(state.reviewOnly));$('reviewCount').textContent=String(reviewing.size);$('clearSearch').hidden=!state.query;
}
function renderNavigation(list){
 $('topicCount').textContent=String(list.length);$('listLabel').textContent=state.reviewOnly?'待复习话题':state.query?'搜索结果':'选择话题';
 $('topicList').innerHTML=list.length?list.map(t=>`<button type="button" class="topic-button" data-topic="${t.id}" aria-current="${t.id===state.selected}" aria-label="${escapeHTML(t.title)}，${t.questionCount}个小问${reviewing.has(t.id)?'，待复习':''}"><span class="topic-number">${String(topics.indexOf(t)+1).padStart(2,'0')}</span><span class="topic-name">${highlight(t.title)}</span>${reviewing.has(t.id)?'<span class="review-dot" title="待复习" aria-hidden="true"></span>':''}<span class="topic-qcount">${matchingCount(t)}题</span></button>`).join(''):'<div class="nav-empty">没有匹配的话题<br>试试其他关键词或筛选条件</div>';
}
function renderTopic(list){
 const topic=list.find(t=>t.id===state.selected);
 if(!topic){$('content').innerHTML=`<section class="empty-state"><div class="empty-icon">${icon('search')}</div><h1 id="topicHeading" tabindex="-1">${state.reviewOnly&&!reviewing.size?'还没有待复习话题':'没有找到匹配的话题'}</h1><p>${state.reviewOnly&&!reviewing.size?'在话题右上角标记「待复习」，下次可集中查看。':'试试更短的关键词，或调整来源与分类。'}</p><button type="button" class="reset-button" data-action="reset">查看全部话题</button></section>`;return;}
 const count=matchingCount(topic);const position=list.indexOf(topic);const selected=reviewing.has(topic.id);const part23=topic.part==='part23';
 const cue=part23?`<section class="cue-card" aria-labelledby="cueLabel"><div class="cue-label" id="cueLabel">${icon('cue')} PART 2 · CUE CARD</div><p class="cue-title" lang="en">${highlight(topic.cue)}</p><p class="cue-prompt" lang="en">You should say:</p><ul class="cue-points" lang="en">${topic.points.map(p=>`<li>${highlight(p)}</li>`).join('')}</ul></section>`:'';
 const sections=topic.sections.map(g=>{const qs=visibleQuestions(topic,g);if(!qs.length)return '';return `<section class="discussion${part23?'':' part1-questions'}">${g.title?`<h3 lang="en">${highlight(g.title)}</h3>`:''}<ol class="question-list">${qs.map(q=>`<li class="question" value="${q.number}" data-question="${topic.id}-${q.number}" data-source-kind="${q.source}"><span class="question-number" aria-hidden="true">${q.number}.</span><span class="source-mark" role="img" aria-label="${q.source==='core'?'以500块为主':'其他题库独有或独立补充'}">${q.source==='core'?'⭐':'🔵'}</span><p class="question-text" lang="en">${highlight(q.text)}</p></li>`).join('')}</ol></section>`;}).join('');
 $('content').innerHTML=`<header class="topic-header"><div class="topic-eyebrow">${part23?'PART 2 & 3 · '+categoryNames[topic.category]:'PART 1 · 日常话题'}</div><div class="title-row"><h1 id="topicHeading" tabindex="-1">${highlight(topic.title)}</h1><button type="button" class="review-toggle" data-action="review" aria-pressed="${selected}" aria-label="${selected?'移出待复习':'加入待复习'}">${icon('bookmark')}<span>${selected?'已加入待复习':'待复习'}</span></button></div><div class="topic-meta">${count===topic.questionCount?topic.questionCount+' 个小问':'显示 '+count+' / '+topic.questionCount+' 个小问'}</div></header>${cue}<article class="question-paper" aria-label="${part23?'Part 3 讨论问题':'Part 1 口语问题'}"><div class="part-heading"><h2>${part23?'PART 3 · DISCUSSION':'PART 1 · QUESTIONS'}</h2><span>${part23?'按讨论主题学习':'逐题开口练习'}</span></div>${sections||'<p class="filter-empty">当前筛选下没有小问。</p>'}</article><div class="source-legend"><span>⭐ <b>500块为主</b> · / 可含补充对照</span><span>🔵 <b>其他题库独有 / 独立补充</b></span></div><nav class="topic-footer" aria-label="切换学习话题"><button type="button" data-action="previous" ${position===0?'disabled':''}>${icon('left')}上一话题</button><span class="topic-position">${position+1} / ${list.length} 话题</span><button type="button" data-action="next" ${position===list.length-1?'disabled':''}>下一话题${icon('right')}</button></nav>`;
}
function render(){const list=filteredTopics();if(list.length&&!list.some(t=>t.id===state.selected))state.selected=list[0].id;renderControls();renderNavigation(list);renderTopic(list);persist();return list;}
function selectTopic(id,focus=false){if(!validIds.has(id))return;state.selected=id;render();$('topicList').querySelector('[aria-current="true"]')?.scrollIntoView?.({block:'nearest'});$('readingScroll').scrollTop=0;setDrawer(false,false);if(focus)$('topicHeading')?.focus({preventScroll:true});}
function setDrawer(open,restoreFocus=true){drawerOpen=Boolean(open&&smallScreen());$('sidebar').classList.toggle('open',drawerOpen);$('drawerScrim').classList.toggle('open',drawerOpen);$('menuButton').setAttribute('aria-expanded',String(drawerOpen));$('sidebar').inert=smallScreen()&&!drawerOpen;$('main').inert=drawerOpen;$('appHeader').inert=drawerOpen;if(drawerOpen){$('sidebar').setAttribute('role','dialog');$('sidebar').setAttribute('aria-modal','true');$('closeMenu').focus();}else{$('sidebar').setAttribute('role','navigation');$('sidebar').removeAttribute('aria-modal');if(restoreFocus&&smallScreen())$('menuButton').focus();}}
function resetFilters(){state.part='all';state.category='all';state.source='all';state.query='';state.reviewOnly=false;$('searchInput').value='';render();}
$('searchInput').addEventListener('input',event=>{state.query=event.target.value.trim();render();$('readingScroll').scrollTop=0;});
$('clearSearch').addEventListener('click',()=>{state.query='';$('searchInput').value='';render();$('searchInput').focus();});
$('partTabs').addEventListener('click',event=>{const b=event.target.closest('[data-part]');if(!b)return;state.part=b.dataset.part;state.category='all';render();$('readingScroll').scrollTop=0;});
$('categoryFilters').addEventListener('click',event=>{const b=event.target.closest('[data-category]');if(!b)return;state.category=b.dataset.category;render();$('readingScroll').scrollTop=0;});
$('sourceTabs').addEventListener('click',event=>{const b=event.target.closest('[data-source]');if(!b)return;state.source=b.dataset.source;render();$('readingScroll').scrollTop=0;});
$('reviewFilter').addEventListener('click',()=>{state.reviewOnly=!state.reviewOnly;render();$('readingScroll').scrollTop=0;});
$('topicList').addEventListener('click',event=>{const b=event.target.closest('[data-topic]');if(b)selectTopic(b.dataset.topic,true);});
$('content').addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action;
 if(action==='review'){const topic=topics.find(t=>t.id===state.selected);const had=reviewing.has(topic.id);had?reviewing.delete(topic.id):reviewing.add(topic.id);render();flash(had?'已移出待复习':'已加入待复习');$('content').querySelector('[data-action="review"]')?.focus({preventScroll:true});}
 else if(action==='reset')resetFilters();
 else{const list=filteredTopics();const index=list.findIndex(t=>t.id===state.selected);const next=list[index+(action==='next'?1:-1)];if(next)selectTopic(next.id,true);}
});
$('menuButton').addEventListener('click',()=>setDrawer(true));$('closeMenu').addEventListener('click',()=>setDrawer(false));$('drawerScrim').addEventListener('click',()=>setDrawer(false));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&drawerOpen)setDrawer(false);if(event.key==='Tab'&&drawerOpen){const buttons=[...$('sidebar').querySelectorAll('button:not([disabled])')].filter(b=>b.getClientRects().length);const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.addEventListener('resize',()=>setDrawer(drawerOpen,false));
window.addEventListener('hashchange',()=>{let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}if(validIds.has(id)){resetFilters();selectTopic(id,true);}});
render();setDrawer(false,false);
</script>
</body></html>
